name: Release

on:
  push:
    branches: [main, feature]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure pre-release mode (changeset filtering)
        if: github.ref_name == 'feature'
        run: pnpm pre:enter-alpha

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2.1.0

  gate:
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.wait.outputs.ci }}
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for CI to pass
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # workflow_dispatch：由 version job 在 PR CI 绿后显式触发（GITHUB_TOKEN
          # 触发的合并 push 不会产生 workflow run，dispatch 是例外），直接放行
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✔ dispatched run, CI gate passed (PR CI was green before merge)"
            echo "ci=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/wait-ci-green.sh "${{ github.sha }}"
          echo "ci=success" >> "$GITHUB_OUTPUT"

  version:
    if: github.event_name == 'push' && needs.gate.outputs.ci == 'success' && needs.select-mode.outputs.mode == 'version'
    needs: [select-mode, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Materialize base branch for changesets
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release plan (sub-package release ⇒ root must release)
        run: pnpm changeset status --output=.changeset/status.json

      - name: Configure pre-release mode
        run: |
          if [ "${{ github.ref_name }}" = "feature" ]; then
            pnpm pre:enter-alpha
          elif node -p "require('./package.json').version" | grep -q -- "-"; then
            pnpm pre:enter-alpha
            pnpm pre:exit
          fi

      - name: Compute version PR title
        id: title
        run: |
          echo "title=Version Packages - $(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Version packages and create/update pull request
        id: version
        uses: changesets/action/version@v2.1.0
        with:
          script: pnpm ci:version
          commit-message: "chore: version packages"
          pr-title: ${{ steps.title.outputs.title }}
          pr-base-branch: ${{ github.ref_name }}

      - name: Wait for version PR CI, merge and trigger publish
        # 仅 feature（alpha 通道）自动合并；main 方向（正式版）的 version PR
        # 永不自动合并——由人工合并，合并 push 自然触发 publish 通道
        if: steps.version.outputs.pr-number != '' && github.ref_name == 'feature'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ steps.version.outputs.pr-number }}"
          sha=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$pr" \
            | jq -r .head.sha)
          echo "waiting for CI on PR #$pr ($sha)"
          bash scripts/wait-ci-green.sh "$sha"
          # 合并（GITHUB_TOKEN 触发的合并 push 不产生 workflow run，
          # 用 workflow_dispatch 显式触发发布通道——dispatch 不受该限制；
          # --delete-branch 防止 changeset-release/feature 残留）
          gh pr merge "$pr" --squash --delete-branch
          echo "✔ merged PR #$pr"
          gh workflow run release.yml --ref "${{ github.ref_name }}"
          echo "✔ dispatched Release workflow (publish channel)"

  pack:
    if: needs.gate.outputs.ci == 'success' && needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, gate]
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Materialize base branch for changesets
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2.1.0
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Materialize base branch for changesets
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure pre-release mode
        if: github.ref_name == 'feature'
        run: pnpm pre:enter-alpha

      - name: Publish packages
        uses: changesets/action/publish@v2.1.0
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

      - name: Build root package
        run: pnpm build

      - name: Publish root package
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view @pawover/kit@$version version >/dev/null 2>&1; then
            echo "root package @pawover/kit@$version already published, skipping"
          else
            if [ "${{ github.ref_name }}" = "feature" ]; then
              pnpm publish --no-git-checks --access public --tag alpha
            else
              pnpm publish --no-git-checks --access public
            fi
          fi

  sync-baseline:
    # main 正式版发布成功后，把稳定版版本号回推 feature（基线同步），
    # 否则下一轮 alpha 从旧基线递增、剥离后撞已发布版本（防撞车拦截）。
    # 发布本身已在此前完成，同步失败不阻断（脚本内部软失败并告警）。
    if: github.ref_name == 'main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUSKY: "0"
    steps:
      - name: Checkout feature
        uses: actions/checkout@v7
        with:
          ref: feature
          fetch-depth: 0

      - name: Sync stable baseline versions to feature
        run: node scripts/syncBaseline.ts

name: Release

on:
  push:
    branches: [main, feature]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure pre-release mode (changeset filtering)
        if: github.ref_name == 'feature'
        run: pnpm pre:enter-alpha

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  gate:
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.wait.outputs.ci }}
    permissions:
      contents: read
      checks: read
    steps:
      - name: Wait for CI to pass
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.sha }}"
          for i in $(seq 1 180); do
            body=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$sha/check-runs")
            run=$(echo "$body" | jq -r '.check_runs[]? | select(.name == "ci") | .status + ":" + (.conclusion // "")' | tail -1)
            if [ -n "$run" ]; then
              status=${run%%:*}
              conclusion=${run##*:}
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "✔ CI passed ($sha)"
                  echo "ci=success" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "::error::CI failed ($conclusion), release blocked"
                exit 1
              fi
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for CI on $sha"
          exit 1

  version:
    if: needs.gate.outputs.ci == 'success' && needs.select-mode.outputs.mode == 'version'
    needs: [select-mode, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Materialize base branch for changesets
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release plan (sub-package release ⇒ root must release)
        run: pnpm changeset status --output=.changeset/status.json

      - name: Configure pre-release mode
        run: |
          if [ "${{ github.ref_name }}" = "feature" ]; then
            pnpm pre:enter-alpha
          elif node -p "require('./package.json').version" | grep -q -- "-"; then
            pnpm pre:enter-alpha
            pnpm pre:exit
          fi

      - name: Compute version PR title
        id: title
        run: |
          echo "title=Version Packages - $(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Version packages and create/update pull request
        id: version
        uses: changesets/action/version@v2
        with:
          script: pnpm ci:version
          commit-message: 'chore: version packages'
          pr-title: ${{ steps.title.outputs.title }}
          pr-base-branch: ${{ github.ref_name }}

      - name: Enable auto-merge on version pull request (alpha channel only)
        if: github.ref_name == 'feature' && steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.version.outputs.pr-number }}" --auto --squash
          echo "auto-merge enabled on PR #${{ steps.version.outputs.pr-number }}"

      - name: Verify root package bumped alongside sub-packages
        run: node scripts/verify-release.mjs

  pack:
    if: needs.gate.outputs.ci == 'success' && needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, gate]
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Materialize base branch for changesets
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Materialize base branch for changesets
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure pre-release mode
        if: github.ref_name == 'feature'
        run: pnpm pre:enter-alpha

      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

      - name: Build root package
        run: pnpm build

      - name: Publish root package
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view @pawover/kit@$version version >/dev/null 2>&1; then
            echo "root package @pawover/kit@$version already published, skipping"
          else
            if [ "${{ github.ref_name }}" = "feature" ]; then
              pnpm publish --no-git-checks --access public --tag alpha
            else
              pnpm publish --no-git-checks --access public
            fi
          fi
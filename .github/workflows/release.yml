name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, feature]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-mode:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: github.event.workflow_run.conclusion == 'success' && needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Materialize base branch for changesets
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release plan (sub-package release ⇒ root must release)
        run: pnpm changeset status --output=.changeset/status.json

      - name: Configure pre-release mode
        run: |
          if [ "${{ github.ref_name }}" = "feature" ]; then
            pnpm pre:enter-alpha
          elif node -p "require('./package.json').version" | grep -q -- "-"; then
            pnpm pre:enter-alpha
            pnpm pre:exit
          fi

      - name: Version packages and create/update pull request
        id: version
        uses: changesets/action/version@v2
        with:
          script: pnpm ci:version
          commit-message: 'chore: version packages'
          pr-title: 'Version Packages'
          pr-base-branch: ${{ github.ref_name }}

      - name: Enable auto-merge on version pull request
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pulls/${{ steps.version.outputs.pr-number }}/auto-merge" \
            -f merge_method=squash \
            --jq '.id' >/dev/null
          echo "auto-merge enabled on PR #${{ steps.version.outputs.pr-number }}"

      - name: Verify root package bumped alongside sub-packages
        run: node scripts/verify-release.mjs

  pack:
    if: github.event.workflow_run.conclusion == 'success' && needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Materialize base branch for changesets
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    if: github.event.workflow_run.conclusion == 'success'
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Materialize base branch for changesets
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure pre-release mode
        if: github.ref_name == 'feature'
        run: pnpm pre:enter-alpha

      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

      - name: Build root package
        run: pnpm build

      - name: Publish root package
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view @pawover/kit@$version version >/dev/null 2>&1; then
            echo "root package @pawover/kit@$version already published, skipping"
          else
            pnpm publish --no-git-checks --access public
          fi
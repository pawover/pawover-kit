name: Release

on:
  push:
    branches: [ main, feature ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-mode:
    name: Decide release action
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable alpha pre-release mode
        if: github.ref_name == 'feature'
        run: pnpm pre:enter-alpha

      - name: Decide version, publish, or nothing
        id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  gate:
    name: Wait for CI
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.wait.outputs.ci }}
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for CI
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # workflow_dispatch：由 version job 在 PR CI 绿后显式触发（GITHUB_TOKEN
          # 触发的合并 push 不会产生 workflow run，dispatch 是例外），直接放行
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✔ dispatched run, CI gate passed (PR CI was green before merge)"
            echo "ci=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/wait-ci-green.sh "${{ github.sha }}"
          echo "ci=success" >> "$GITHUB_OUTPUT"

  version:
    name: Create version PR
    if: github.event_name == 'push' && needs.gate.outputs.ci == 'success' && needs.select-mode.outputs.mode == 'version'
    needs: [ select-mode, gate ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    env:
      HAS_RELEASE_APP_TOKEN: ${{ (secrets.RELEASE_APP_CLIENT_ID != '' || secrets.RELEASE_APP_ID != '') && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare main branch reference
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check root version bump
        run: pnpm changeset status --output=.changeset/status.json

      - name: Enable alpha pre-release mode
        run: |
          if [ "${{ github.ref_name }}" = "feature" ]; then
            pnpm pre:enter-alpha
          elif node -p "require('./package.json').version" | grep -q -- "-"; then
            pnpm pre:enter-alpha
            pnpm pre:exit
          fi

      - name: Create GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP_TOKEN == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          # client-id 为空时回退 legacy app-id：存量环境可能只配了 RELEASE_APP_ID
          app-id: ${{ secrets.RELEASE_APP_CLIENT_ID == '' && secrets.RELEASE_APP_ID || '' }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Choose token for version PR
        id: pr-token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            token="$APP_TOKEN"
            echo "using GitHub App installation token for version PR"
          elif [ -n "$PAT_TOKEN" ]; then
            token="$PAT_TOKEN"
            echo "::warning::release App token 不可用，version PR 回退 secrets.RELEASE_PR_TOKEN 创建。"
          else
            token="${{ github.token }}"
            echo "::warning::未配置 RELEASE_APP_CLIENT_ID（或 RELEASE_APP_ID）/RELEASE_APP_PRIVATE_KEY 与 RELEASE_PR_TOKEN：version PR 退回 github.token 创建，其 workflow run 会停在待人工批准状态（action_required），feature 通道的自动合并将失败。"
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Set version PR title
        id: title
        run: |
          echo "title=Version Packages - $(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Create or update version PR
        id: version
        uses: changesets/action/version@v2.1.2
        env:
          # 版本改动此刻仍是工作区变更，触发 sha 即 version PR 的 base tip
          INTENT_REVIEW_BASE: ${{ github.sha }}
        with:
          # 用 App installation token 创建 PR：github.token 创建的 PR 其 run 停在
          # action_required，下面的 CI 等待永远等不到结果。
          github-token: ${{ steps.pr-token.outputs.token }}
          script: pnpm ci:version
          commit-message: "chore: version packages"
          pr-title: ${{ steps.title.outputs.title }}
          pr-base-branch: ${{ github.ref_name }}

      - name: Wait for checks, merge, and publish
        # 仅 feature（alpha 通道）自动合并；main 方向（正式版）的 version PR
        # 永不自动合并——由人工合并，合并 push 自然触发 publish 通道
        if: steps.version.outputs.pr-number != '' && github.ref_name == 'feature'
        env:
          # 合并与 dispatch 必须用 github.token：用 App/PAT 合并产生的 push 会再触发
          # 一次 release.yml 的 push 通道，与随后的 dispatch 双跑。
          GH_TOKEN: ${{ github.token }}
          CI_WAIT_TIMEOUT_SECONDS: 2400
        run: |
          pr="${{ steps.version.outputs.pr-number }}"
          sha=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)
          echo "waiting for CI on PR #$pr ($sha)"
          bash scripts/wait-ci-green.sh "$sha"
          # 合并（GITHUB_TOKEN 触发的合并 push 不产生 workflow run，
          # 用 workflow_dispatch 显式触发正式版发布——dispatch 不受该限制；
          # --delete-branch 防止 changeset-release/feature 残留）
          gh pr merge "$pr" --squash --delete-branch
          echo "✔ merged PR #$pr"
          gh workflow run release.yml --ref "${{ github.ref_name }}"
          echo "✔ dispatched Release workflow (publish channel)"

  pack:
    name: Build and pack
    if: needs.gate.outputs.ci == 'success' && needs.select-mode.outputs.mode == 'publish'
    needs: [ select-mode, gate ]
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare main branch reference
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish packages
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare main branch reference
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable alpha pre-release mode
        if: github.ref_name == 'feature'
        run: pnpm pre:enter-alpha

      - name: Publish packages
        uses: changesets/action/publish@v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

      - name: Build root package
        run: pnpm build

      - name: Publish root package
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view @pawover/kit@$version version >/dev/null 2>&1; then
            echo "root package @pawover/kit@$version already published, skipping"
          else
            if [ "${{ github.ref_name }}" = "feature" ]; then
              pnpm publish --no-git-checks --access public --tag alpha
            else
              pnpm publish --no-git-checks --access public
            fi
          fi

  sync-baseline:
    name: Sync stable versions to feature
    # main 正式版发布成功后，把稳定版版本号同步回 feature，
    # 否则下一轮 alpha 从旧版本号递增、还原成正式版后会撞已发布版本（版本已存在则拦截）。
    # 发布本身已在此前完成，同步失败不阻断（脚本内部软失败并告警）。
    if: github.ref_name == 'main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUSKY: "0"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature
          fetch-depth: 0

      - name: Sync stable versions to feature
        run: node scripts/syncBaseline.ts
